# push 到 main 自动构建并部署到 GitHub Pages（spec/01 NFR-7）
# 仍发布到 gh-pages 分支，仓库 Pages 设置无需改动（Source 保持 gh-pages）
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # VITE_* 为前端构建期公开变量（本就会打进 JS 包），从仓库 Variables 注入；不设则为本地模式
      - run: npm run build
        env:
          VITE_TCB_ENV: ${{ vars.VITE_TCB_ENV }}
          VITE_AI_BASE_URL: ${{ vars.VITE_AI_BASE_URL }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
